name: Deploy Cloud Run Job

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      PROJECT_ID: dealer-contacts-project
      REGION: us-central1
      REPOSITORY: dealer-contact-system
      IMAGE_NAME: dealer-contact-system
      JOB_NAME: dealer-contact-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories create "$REPOSITORY" \
            --repository-format=docker \
            --location="$REGION" \
            --description="Dealer contact system images" \
            --project="$PROJECT_ID" || true

      - name: Build image
        run: |
          docker build \
            --tag "$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:latest" \
            .

      - name: Push image
        run: |
          docker push "$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:latest"

      - name: Deploy Cloud Run Job
        run: |
          gcloud run jobs deploy "$JOB_NAME" \
            --image "$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:latest" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --service-account "dealer-contact-worker@$PROJECT_ID.iam.gserviceaccount.com" \
            --set-env-vars "APP_ENVIRONMENT=cloud,BIGQUERY_PROJECT_ID=$PROJECT_ID,BIGQUERY_DATASET=dealer_data,VALIDATE_WORKER_BATCH_SIZE=50,ENRICH_WORKER_BATCH_SIZE=25,EXTRACT_WORKER_BATCH_SIZE=25,RETRY_BLOCKED_WORKER_BATCH_SIZE=10" \
            --max-retries 0 \
            --task-timeout 3600s \
            --args run-queue-cycle,--seed
